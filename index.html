<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>자동 DM 관리</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0e0f12;--panel:#17181d;--panel2:#1f2027;--line:#2b2d35;--ink:#f2f2f4;--sub:#9a9ca4;--acc:#e1306c;--ok:#2fbf71;--bad:#ff5a5f}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Noto Sans KR",system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--panel2);min-height:40px}
button.p{background:var(--acc);color:#fff;font-weight:700}
button.g{background:transparent;border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
input,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
header h1{font-size:24px;font-weight:900;margin:0;flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.accs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.acc{flex:none;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 14px 8px 8px;min-height:56px;text-align:left}
.acc.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.av{width:38px;height:38px;border-radius:50%;background:#333 center/cover;flex:none}
.acc b{display:block;font-size:15px}.acc small{color:var(--sub);font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.tabs{display:flex;gap:6px;margin:22px 0 14px}
.tabs button{background:transparent;border:1px solid var(--line)}
.tabs button.on{background:var(--ink);color:var(--bg);font-weight:700}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:12px}
.rule{display:flex;flex-direction:column;gap:10px}
.rule .top{display:flex;gap:12px}
.th{width:64px;height:64px;border-radius:10px;background:var(--panel2) center/cover;flex:none;display:grid;place-items:center;color:var(--sub);font-size:12px;text-align:center}
.kw{display:flex;flex-wrap:wrap;gap:6px}
.kw span{background:rgba(225,48,108,.15);color:#ff7aa5;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:500}
.dm{background:var(--panel2);border-radius:12px;padding:10px 12px;white-space:pre-wrap;font-size:14px;max-height:120px;overflow:auto;color:#d8d9de}
.muted{color:var(--sub);font-size:13px}
.tog{width:46px;height:26px;border-radius:13px;background:#444;position:relative;padding:0;min-height:0}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.tog.on{background:var(--ok)}.tog.on::after{left:23px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--sub);font-weight:500;font-size:13px}
.okc{color:var(--ok)}.badc{color:var(--bad)}
.empty{text-align:center;color:var(--sub);padding:40px 16px}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:0;width:min(760px,94vw);max-height:92vh;overflow:hidden}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px;overflow:auto;max-height:calc(92vh - 2px)}
.dlg.split{padding:0;gap:0;overflow:hidden}
.dh{padding:18px 20px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dh h2{flex:1}.dh .x{min-height:36px;width:36px;padding:0;background:transparent;font-size:20px;color:var(--sub)}
.db{flex:1;overflow-y:auto;padding:16px 20px 20px;display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.df{padding:12px 20px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--panel)}
*{scrollbar-width:thin;scrollbar-color:#3a3c45 transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#3a3c45;border-radius:8px}::-webkit-scrollbar-track{background:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 8px;min-height:46px;cursor:text}
.chips:focus-within{outline:2px solid var(--acc);outline-offset:1px}
.chips span{display:inline-flex;align-items:center;gap:4px;background:rgba(225,48,108,.18);color:#ff8ab0;border-radius:999px;padding:3px 6px 3px 11px;font-size:14px;font-weight:500}
.chips span button{min-height:0;width:20px;height:20px;padding:0;border-radius:50%;background:transparent;color:inherit;font-size:14px;line-height:1}
.chips span button:hover{background:rgba(255,255,255,.12)}
.chips input{flex:1;min-width:120px;border:0;background:transparent;padding:4px;outline:none}
.cnt{color:var(--sub);font-size:12px;text-align:right;margin-top:-2px}
.dlg h2{margin:0;font-size:20px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:500}
label.f small{color:var(--sub);font-weight:400}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;max-height:260px;overflow:auto;padding:2px}
.mi{aspect-ratio:1;border-radius:10px;background:var(--panel2) center/cover;border:2px solid transparent;padding:0;position:relative;overflow:hidden}
.mi.on{border-color:var(--acc)}
.mi.all{display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--panel2)}
.mi .t{position:absolute;inset:auto 0 0 0;background:linear-gradient(transparent,rgba(0,0,0,.8));font-size:11px;padding:10px 4px 3px;color:#fff;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi small{color:var(--sub);font-size:13px;display:block}.kpi b{font-size:28px;font-weight:900;line-height:1.2}
.kpi em{font-style:normal;color:var(--sub);font-size:13px;margin-left:4px}
.kpi .sub2{color:var(--sub);font-size:12px;margin-top:2px}
input[type=date]{color-scheme:dark;min-height:40px}
.chart{position:relative;height:240px}.chart svg{position:absolute;inset:0;width:100%;height:100%}
.legend{display:flex;gap:14px;font-size:13px;color:var(--sub);margin-bottom:8px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border-radius:0;background:transparent;min-height:36px;padding:6px 12px}.seg button.on{background:var(--ink);color:var(--bg);font-weight:700}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.modes button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--panel2);padding:10px 12px;border-radius:12px}
.modes button small{color:var(--sub);font-size:12px}.modes button.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset;background:rgba(225,48,108,.08)}
.ed{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:16px;align-items:start}.ed .col{display:flex;flex-direction:column;gap:14px}
.pv{position:sticky;top:0;display:flex;flex-direction:column;gap:6px;background:#000;border-radius:16px;padding:12px;border:1px solid var(--line)}
.bub{background:#262730;border-radius:16px;padding:10px 12px;font-size:13px;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:hidden}
.bub .bb{margin:10px -12px -10px;border-top:1px solid #3a3b45;padding:9px;text-align:center;font-weight:700;color:#7aa7ff}
.qr{align-self:flex-start;border:1px solid #7aa7ff;color:#7aa7ff;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700}
.tap{color:var(--sub);font-size:11px;text-align:center}
@media(max-width:640px){.modes{grid-template-columns:1fr}.ed{grid-template-columns:1fr}.pv{position:static}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.login{max-width:360px;margin:16vh auto;display:flex;flex-direction:column;gap:12px;text-align:center}
.warn{color:#ffb84d;font-size:12px}
@media(max-width:600px){.hide-m{display:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast"></div>
<script>
{
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
let key = ''; try { key = localStorage.getItem('adm') || ''; } catch {}
const S = { accounts: [], connectUrl: '', setup: null, stats: null, preset: '7', from: '', to: '', scope: 'one', cur: null, tab: 'rules', rules: [], logs: [], media: null };

function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2000); }

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'x-admin-key': key, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { key = ''; try { localStorage.removeItem('adm'); } catch {} renderLogin('비밀번호가 틀렸어요'); throw new Error('401'); }
  if (!r.ok) throw new Error(j.error || '오류가 났어요');
  return j;
}

function renderLogin(err = '') {
  $('#app').innerHTML = `<form class="login" id="lf"><h1 style="font-size:26px;margin:0 0 8px">자동 DM 관리</h1>
    <input type="password" id="pw" placeholder="관리자 비밀번호" autocomplete="current-password">
    <button class="p">들어가기</button><div class="badc">${esc(err)}</div></form>`;
  $('#lf').onsubmit = (e) => { e.preventDefault(); key = $('#pw').value; try { localStorage.setItem('adm', key); } catch {} load(); };
  $('#pw').focus();
}

async function load() {
  try {
    const j = await api('/api/accounts');
    S.accounts = j.accounts; S.connectUrl = j.connectUrl; S.setup = j.setup;
    if (!S.cur || !S.accounts.find((a) => a.igId === S.cur)) S.cur = S.accounts[0]?.igId || null;
    render();
    if (S.cur) loadTab();
  } catch (e) { if (e.message !== '401') renderLogin(e.message); }
}

async function loadTab() {
  if (!S.cur) return;
  const body = $('#tabBody'); if (body) body.innerHTML = '<div class="empty">불러오는 중…</div>';
  try {
    if (S.tab === 'rules') S.rules = (await api('/api/rules?igId=' + S.cur)).rules;
    else if (S.tab === 'stats') { if (!S.from) setPreset(); S.stats = await api(`/api/stats?igId=${S.scope === 'all' ? 'all' : S.cur}&from=${S.from.replace(/-/g, '')}&to=${S.to.replace(/-/g, '')}`); }
    else S.logs = (await api('/api/logs?igId=' + S.cur)).logs;
    renderTab();
  } catch (e) { if (body) body.innerHTML = `<div class="empty badc">${esc(e.message)}</div>`; }
}

const days = (t) => Math.floor((t - Date.now()) / 864e5);

function render() {
  const acc = S.accounts.find((a) => a.igId === S.cur);
  $('#app').innerHTML = `
  <header><h1>자동 DM 관리</h1>
    <button class="g" id="copyLink">🔗 모델 연결 링크 복사</button>
    <button class="g" id="setupBtn">⚙️ 메타 앱 설정값</button>
    <button class="g" id="logout">로그아웃</button></header>
  ${S.accounts.length ? `<div class="accs">${S.accounts.map((a) => `
    <button class="acc ${a.igId === S.cur ? 'on' : ''}" data-acc="${esc(a.igId)}">
      <span class="av" style="background-image:url('${esc(a.picture)}')"></span>
      <span><b>@${esc(a.username)}</b><small>${a.refreshError ? '<span class="warn">토큰 갱신 실패 · 다시 연결 필요</span>' : (days(a.expiresAt) > 3650 ? '연결됨' : `토큰 ${days(a.expiresAt)}일 남음`)}</small></span>
    </button>`).join('')}</div>` : `<div class="card empty">아직 연결된 계정이 없어요.<br><br>위의 <b>모델 연결 링크 복사</b>를 눌러 모델에게 보내주세요.<br>모델이 링크를 열고 인스타 로그인 → 허용하면 여기에 나타나요.</div>`}
  ${acc ? `
  <div class="tabs">
    <button data-tab="rules" class="${S.tab === 'rules' ? 'on' : ''}">자동 DM 규칙</button>
    <button data-tab="logs" class="${S.tab === 'logs' ? 'on' : ''}">발송 기록</button>
    <button data-tab="stats" class="${S.tab === 'stats' ? 'on' : ''}">📊 통계</button>
    <span class="sp"></span>
    ${S.tab === 'rules' ? '<button class="p" id="addRule">+ 규칙 추가</button>' : S.tab === 'stats' ? `
      <span class="seg">${[['one', '이 계정'], ['all', '전체 계정']].map(([k, l]) => `<button data-scope="${k}" class="${S.scope === k ? 'on' : ''}">${l}</button>`).join('')}</span>
      <span class="seg">${[['1', '오늘'], ['7', '7일'], ['30', '30일']].map(([k, l]) => `<button data-pre="${k}" class="${S.preset === k ? 'on' : ''}">${l}</button>`).join('')}<button data-pre="cal" class="${S.preset === 'cal' ? 'on' : ''}">📅 기간</button></span>` : '<button class="g" id="reload">새로고침</button>'}
  </div>
  <div id="tabBody"></div>
  <p class="muted" style="margin-top:28px">@${esc(acc.username)} 연결 해제하려면 <button class="g" id="delAcc" style="min-height:0;padding:4px 10px;font-size:13px">연결 해제</button></p>` : ''}`;

  $('#copyLink').onclick = async () => { try { await navigator.clipboard.writeText(S.connectUrl); toast('연결 링크 복사됨'); } catch { showText('모델 연결 링크', S.connectUrl); } };
  $('#setupBtn').onclick = showSetup;
  $('#logout').onclick = () => { key = ''; try { localStorage.removeItem('adm'); } catch {} renderLogin(); };
  document.querySelectorAll('[data-acc]').forEach((b) => b.onclick = () => { S.cur = b.dataset.acc; S.media = null; render(); loadTab(); });
  document.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => { S.tab = b.dataset.tab; render(); loadTab(); });
  $('#addRule') && ($('#addRule').onclick = () => openEditor());
  document.querySelectorAll('[data-pre]').forEach((b) => b.onclick = () => { S.preset = b.dataset.pre; if (S.preset !== 'cal') setPreset(); render(); loadTab(); });
  document.querySelectorAll('[data-scope]').forEach((b) => b.onclick = () => { S.scope = b.dataset.scope; render(); loadTab(); });
  $('#reload') && ($('#reload').onclick = loadTab);
  $('#delAcc') && ($('#delAcc').onclick = () => confirmBox(`@${acc.username} 연결을 해제할까요? 규칙과 기록도 같이 지워져요.`, async () => {
    await api('/api/accounts?igId=' + acc.igId, { method: 'DELETE' }); toast('연결 해제됨'); S.cur = null; load();
  }));
}

function renderTab() {
  const body = $('#tabBody'); if (!body) return;
  if (S.tab === 'rules') {
    if (!S.rules.length) { body.innerHTML = `<div class="card empty">규칙이 없어요. <b>+ 규칙 추가</b>로 만들어보세요.</div>`; return; }
    body.innerHTML = `<div class="rules">${S.rules.map((r) => `
      <div class="card rule">
        <div class="top">
          <div class="th" style="${r.mediaThumb ? `background-image:url('${esc(r.mediaThumb)}')` : ''}">${r.mediaId === 'all' ? '모든<br>게시물' : (r.mediaThumb ? '' : '게시물')}</div>
          <div style="flex:1">
            <div class="row"><b style="flex:1">${esc(r.name || '이름 없음')}</b><button class="tog ${r.on !== false ? 'on' : ''}" data-tog="${esc(r.id)}" aria-label="켜기/끄기"></button></div>
            <div class="muted">${r.mediaId === 'all' ? '모든 게시물·릴스' : esc(r.mediaLabel || '선택한 게시물')} · ${({ text: '글자만', button: '버튼만', two: '2번 나눠 보내기' })[r.mode || (r.btnUrl ? 'button' : 'text')]}</div>
          </div>
        </div>
        <div class="kw">${r.keywords.map((k) => `<span>${esc(k)}</span>`).join('')}</div>
        <div class="dm">${esc(r.dm)}${r.btnUrl ? `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line);text-align:center;font-weight:700;color:#7aa7ff">${esc(r.btnTitle || '바로가기')}</div>` : ''}</div>
        ${r.replies?.length ? `<div class="muted">대댓글 ${r.replies.length}개 랜덤</div>` : ''}
        <div class="row"><span class="sp"></span><button class="g" data-del="${esc(r.id)}">삭제</button><button data-edit="${esc(r.id)}">수정</button></div>
      </div>`).join('')}</div>`;
    body.querySelectorAll('[data-edit]').forEach((b) => b.onclick = () => openEditor(S.rules.find((r) => r.id === b.dataset.edit)));
    body.querySelectorAll('[data-del]').forEach((b) => b.onclick = () => confirmBox('이 규칙을 삭제할까요?', async () => {
      S.rules = (await api(`/api/rules?igId=${S.cur}&id=${b.dataset.del}`, { method: 'DELETE' })).rules; renderTab(); toast('삭제됨');
    }));
    body.querySelectorAll('[data-tog]').forEach((b) => b.onclick = async () => {
      const r = S.rules.find((x) => x.id === b.dataset.tog); r.on = r.on === false;
      try { S.rules = (await api('/api/rules?igId=' + S.cur, { method: 'POST', body: JSON.stringify(r) })).rules; renderTab(); toast(r.on ? '켜짐' : '꺼짐'); } catch (e) { toast(e.message); }
    });
  } else if (S.tab === 'stats') {
    renderStats(body);
  } else {
    if (!S.logs.length) { body.innerHTML = `<div class="card empty">아직 발송 기록이 없어요.</div>`; return; }
    const st = (v) => !v ? '<span class="muted">-</span>' : v === 'skip' ? '<span class="muted">중복이라 안 보냄</span>' : v === 'ok' ? '<span class="okc">성공</span>' : `<span class="badc">${esc(v.replace(/^fail: /, '실패: '))}</span>`;
    body.innerHTML = `<div class="card" style="padding:4px 12px;overflow-x:auto"><table>
      <thead><tr><th>시간</th><th>댓글 단 사람</th><th class="hide-m">댓글</th><th>DM</th><th class="hide-m">대댓글</th></tr></thead>
      <tbody>${S.logs.map((l) => `<tr>
        <td style="white-space:nowrap">${new Date(l.at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</td>
        <td>@${esc(l.user)}</td><td class="hide-m">${esc(l.text)}</td><td>${st(l.dm)}${l.mode ? ` <span class="muted">(${esc(l.mode)})</span>` : ''}</td><td class="hide-m">${st(l.reply)}</td></tr>`).join('')}</tbody></table></div>`;
  }
}

async function openEditor(rule) {
  const r = rule ? JSON.parse(JSON.stringify(rule)) : { mediaId: 'all', keywords: [], dm: '', replies: [], name: '', on: true, mode: 'two', once: true };
  r.mode = r.mode || (r.btnUrl ? 'button' : 'text');
  const d = $('#dlg'), b = $('#dlgBody');
  b.classList.add('split');
  b.innerHTML = `<div class="dh"><h2>${rule ? '규칙 수정' : '규칙 추가'}</h2><button class="x" id="fX" aria-label="닫기">✕</button></div>
    <div class="db">
    <label class="f">이름 <small>나만 보는 메모용</small><input id="fName" value="${esc(r.name)}" placeholder="예: 코성형 정보 이벤트"></label>
    <div class="f" style="display:flex;flex-direction:column;gap:6px"><b style="font-weight:500">적용할 게시물</b>
      <div class="media" id="mGrid"><div class="empty" style="grid-column:1/-1;padding:16px">게시물 불러오는 중…</div></div></div>
    <div class="f" style="display:flex;flex-direction:column;gap:6px"><b style="font-weight:500">키워드 <small class="muted" style="font-weight:400">입력하고 Enter · 댓글에 이 단어가 들어가면 발송 (띄어쓰기·대소문자 무시)</small></b>
      <div class="chips" id="fKw"><input id="fKwIn" placeholder="예: 정보" enterkeyhint="done"></div></div>
    <div class="f" style="display:flex;flex-direction:column;gap:8px"><b style="font-weight:500">보내는 방식</b>
      <div class="modes" id="fMode">
        <button type="button" data-mode="text"><b>글자만</b><small>DM 1개 · 긴 글 OK</small></button>
        <button type="button" data-mode="button"><b>버튼만</b><small>짧은 글 + 링크 버튼</small></button>
        <button type="button" data-mode="two"><b>2번 나눠 보내기</b><small>긴 글 → '받기' 누르면 버튼</small></button>
      </div></div>
    <div class="ed">
      <div class="col">
        <label class="f"><span id="lDm">첫 번째 DM</span> <small id="hDm"></small><textarea id="fDm" placeholder="DM 내용" maxlength="1000">${esc(r.dm)}</textarea><div class="cnt" id="fDmCnt"></div></label>
        <label class="f m-two">'받기' 버튼 글자 <small>첫 DM 아래에 붙는 버튼 · 누르면 두 번째 DM이 가요</small><input id="fOpen" maxlength="20" placeholder="링크 받기" value="${esc(r.openLabel || '')}"></label>
        <label class="f m-two">두 번째 DM <small>버튼 위에 들어갈 짧은 글 (640자까지)</small><textarea id="fDm2" style="min-height:70px" maxlength="640" placeholder="아래 버튼을 눌러 확인해주세요 👇">${esc(r.dm2 || '')}</textarea></label>
        <div class="f m-btn" style="display:flex;flex-direction:column;gap:6px"><b style="font-weight:500">링크 버튼 <small class="muted" style="font-weight:400">실제 주소는 안 보여요</small></b>
          <div class="row" style="flex-wrap:nowrap"><input id="fBtnT" maxlength="20" style="flex:0 0 40%" placeholder="버튼 글자" value="${esc(r.btnTitle || '')}">
          <input id="fBtnU" placeholder="링크 (예: www.thedoorps.com)" value="${esc(r.btnUrl || '')}"></div></div>
      </div>
      <div class="pv"><small class="muted">미리보기</small><div id="fPrev"></div></div>
    </div>
    <label class="f">대댓글 (선택) <small>한 줄에 하나씩 · 여러 개면 랜덤으로 달려요</small>
      <textarea id="fRp" style="min-height:80px" placeholder="DM 보내드렸어요! 확인해주세요 💌">${esc((r.replies || []).join('\n'))}</textarea></label>
    <label class="row" style="gap:8px;font-weight:500"><input type="checkbox" id="fOnce" style="width:20px;height:20px" ${r.once !== false ? 'checked' : ''}> 같은 사람에게는 1번만 보내기 <small class="muted">(여러 번 댓글 달아도 DM은 처음 1번만)</small></label>
    <label class="row" style="gap:8px;font-weight:500"><input type="checkbox" id="fTrack" style="width:20px;height:20px" ${r.track !== false ? 'checked' : ''}> 링크 클릭 수 세기 <small class="muted">(버튼을 쓰면 주소가 안 보여요 · 본문에 쓴 링크는 추적용 주소로 바뀌어요)</small></label>
    </div>
    <div class="df"><span class="badc" id="fErr" style="flex:1;font-size:14px"></span><button class="g" id="fCancel">취소</button><button class="p" id="fSave">저장</button></div>`;
  d.showModal();
  $('#fCancel').onclick = $('#fX').onclick = () => d.close();
  // 키워드 칩
  const kws = [...r.keywords];
  const kwIn = $('#fKwIn');
  const drawKw = () => {
    $('#fKw').querySelectorAll('span').forEach((x) => x.remove());
    kws.forEach((k, i) => {
      const s = document.createElement('span'); s.textContent = k;
      const x = document.createElement('button'); x.type = 'button'; x.textContent = '×'; x.setAttribute('aria-label', k + ' 삭제');
      x.onclick = (e) => { e.stopPropagation(); kws.splice(i, 1); drawKw(); };
      s.appendChild(x); $('#fKw').insertBefore(s, kwIn);
    });
  };
  const addKw = () => { kwIn.value.split(',').map((v) => v.trim()).filter(Boolean).forEach((v) => { if (!kws.includes(v)) kws.push(v); }); kwIn.value = ''; drawKw(); };
  kwIn.onkeydown = (e) => {
    if (e.isComposing) return;
    if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addKw(); }
    else if (e.key === 'Backspace' && !kwIn.value && kws.length) { kws.pop(); drawKw(); }
  };
  kwIn.onblur = addKw;
  $('#fKw').onclick = () => kwIn.focus();
  drawKw();
  const cnt = () => ($('#fDmCnt').textContent = `${$('#fDm').value.length} / ${r.mode === 'button' ? 640 : 1000}`);
  const bub = (t, btn) => `<div class="bub"><div>${esc(t)}</div>${btn ? `<div class="bb">${esc(btn)}</div>` : ''}</div>`;
  const prev = () => {
    const dm = $('#fDm').value || 'DM 내용', bt = $('#fBtnT').value.trim() || '바로가기', hasU = !!$('#fBtnU').value.trim();
    const open = $('#fOpen').value.trim() || '링크 받기', dm2 = $('#fDm2').value.trim() || '아래 버튼을 눌러 확인해주세요 👇';
    $('#fPrev').innerHTML = r.mode === 'text' ? bub(dm)
      : r.mode === 'button' ? bub(dm, hasU ? bt : '')
      : bub(dm) + `<div class="qr">${esc(open)}</div><div class="tap">↓ 누르면</div>` + bub(dm2, hasU ? bt : '');
  };
  const setMode = (m) => {
    r.mode = m;
    $('#fMode').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x.dataset.mode === m));
    document.querySelectorAll('.m-two').forEach((x) => (x.style.display = m === 'two' ? '' : 'none'));
    document.querySelectorAll('.m-btn').forEach((x) => (x.style.display = m === 'text' ? 'none' : ''));
    $('#lDm').textContent = m === 'two' ? '첫 번째 DM' : '보낼 DM';
    $('#hDm').textContent = m === 'button' ? '버튼 위에 들어가는 글 · 640자까지 (길면 잘려 보여요)' : m === 'two' ? '긴 글 OK · 전부 다 보여요' : '댓글 단 사람에게 가는 DM';
    cnt(); prev();
  };
  $('#fMode').querySelectorAll('button').forEach((x) => (x.onclick = () => setMode(x.dataset.mode)));
  ['#fDm', '#fDm2', '#fOpen', '#fBtnT', '#fBtnU'].forEach((q) => ($(q).oninput = () => { cnt(); prev(); }));
  setMode(r.mode);

  const grid = () => {
    const items = S.media || [];
    $('#mGrid').innerHTML = `<button class="mi all ${r.mediaId === 'all' ? 'on' : ''}" data-m="all">모든 게시물</button>` +
      items.map((m) => `<button class="mi ${r.mediaId === m.id ? 'on' : ''}" data-m="${esc(m.id)}" style="background-image:url('${esc(m.thumbnail_url || m.media_url)}')" title="${esc(m.caption || '')}"><span class="t">${esc((m.caption || '').slice(0, 30) || new Date(m.timestamp).toLocaleDateString('ko-KR'))}</span></button>`).join('');
    $('#mGrid').querySelectorAll('[data-m]').forEach((x) => x.onclick = () => {
      r.mediaId = x.dataset.m;
      const m = items.find((i) => i.id === r.mediaId);
      r.mediaLabel = m ? ((m.caption || '').slice(0, 60) || new Date(m.timestamp).toLocaleDateString('ko-KR')) : '';
      r.mediaThumb = m ? (m.thumbnail_url || m.media_url || '') : '';
      grid();
    });
  };
  if (S.media) grid();
  else api('/api/media?igId=' + S.cur).then((j) => { S.media = j.media; grid(); }).catch((e) => { S.media = []; grid(); $('#fErr').textContent = '게시물 불러오기 실패: ' + e.message; });

  $('#fSave').onclick = async () => {
    r.name = $('#fName').value.trim();
    addKw(); r.keywords = [...kws];
    r.dm = $('#fDm').value.trim();
    r.replies = $('#fRp').value.split('\n').map((s) => s.trim()).filter(Boolean);
    r.track = $('#fTrack').checked;
    r.btnTitle = $('#fBtnT').value.trim(); r.btnUrl = $('#fBtnU').value.trim();
    r.dm2 = $('#fDm2').value.trim(); r.openLabel = $('#fOpen').value.trim(); r.once = $('#fOnce').checked;
    if (r.mode === 'text') { r.btnUrl = ''; }
    if (r.mode === 'button' && !r.btnUrl) return ($('#fErr').textContent = '버튼 링크를 넣어주세요');
    if (r.mode === 'button' && r.dm.length > 640) return ($('#fErr').textContent = '버튼만 보내기는 640자 이하로 줄여주세요');
    if (r.mode === 'two' && !r.btnUrl && !r.dm2) return ($('#fErr').textContent = '두 번째 DM 내용이나 버튼 링크를 넣어주세요');
    if (!r.keywords.length) return ($('#fErr').textContent = '키워드를 넣어주세요');
    if (!r.dm) return ($('#fErr').textContent = 'DM 내용을 넣어주세요');
    $('#fSave').disabled = true;
    try { S.rules = (await api('/api/rules?igId=' + S.cur, { method: 'POST', body: JSON.stringify(r) })).rules; d.close(); renderTab(); toast('저장됨'); }
    catch (e) { $('#fErr').textContent = e.message; $('#fSave').disabled = false; }
  };
}

const fmt = (n) => Number(n || 0).toLocaleString('ko-KR');
const pct = (a, b) => (b ? Math.round((a / b) * 1000) / 10 + '%' : '-');

const kday = (t = Date.now()) => new Date(t + 9 * 3600e3).toISOString().slice(0, 10);
function setPreset() {
  const n = S.preset === '1' ? 1 : S.preset === '30' ? 30 : 7;
  S.to = kday(); S.from = kday(Date.now() - (n - 1) * 864e5);
}

function renderStats(body) {
  const st = S.stats || { series: [], total: {}, people: {} };
  const T = st.total || {}, P = st.people || {};
  const empty = !T.match && !T.dm_ok && !T.click && !T.open;
  const kpi = (label, total, people, unit, note = '') =>
    `<div class="kpi"><small>${label}</small><b>${fmt(people)}</b><em>명</em><div class="sub2">총 ${fmt(total)}${unit}${note}</div></div>`;
  body.innerHTML = `
    ${S.preset === 'cal' ? `<div class="card row" style="margin-bottom:12px;gap:8px">
      <b>기간</b><input type="date" id="dFrom" value="${S.from}" max="${kday()}" style="width:auto">
      <span class="muted">~</span><input type="date" id="dTo" value="${S.to}" max="${kday()}" style="width:auto">
      <button class="p" id="dGo">보기</button><span class="muted" style="font-size:13px">하루만 고르면 시간대별로 보여요</span></div>` : ''}
    <div class="kpis">
      ${kpi('키워드 댓글 단 사람', T.match, P.match, '건')}
      ${kpi('DM 받은 사람', T.dm_ok, P.dm_ok, '건 발송', T.dm_fail ? ` · <span class="badc">실패 ${fmt(T.dm_fail)}</span>` : '')}
      ${T.open || P.open ? kpi("'받기' 누른 사람", T.open, P.open, '회') : ''}
      ${kpi('링크 누른 사람', T.click, P.click, '회 클릭')}
      <div class="kpi"><small>클릭률</small><b>${pct(P.click, P.dm_ok)}</b><div class="sub2">링크 누른 사람 ÷ DM 받은 사람</div></div>
    </div>
    <div class="card" style="margin-bottom:12px">
      <div class="row"><b style="flex:1">${st.hourly ? '시간대별' : '일별'} 추이 · ${fmtRange(st.from, st.to)}</b>
        <div class="legend"><span><i style="background:var(--acc)"></i>DM 발송</span><span><i style="background:var(--ok)"></i>링크 클릭</span></div></div>
      ${empty ? '<div class="empty">이 기간에는 데이터가 없어요.</div>' : '<div class="chart" id="chart"><svg></svg></div>'}
    </div>
    ${S.scope === 'all' ? acctTable(st.byAccount || []) : ruleTable(st.byRule || [])}`;
  if (!empty) drawChart($('#chart svg'), st.series);
  if ($('#dGo')) $('#dGo').onclick = () => {
    let f = $('#dFrom').value, t = $('#dTo').value;
    if (!f || !t) return toast('시작일과 종료일을 골라주세요');
    if (f > t) [f, t] = [t, f];
    S.from = f; S.to = t; loadTab();
  };
}
const fmtRange = (f, t) => { const d = (x) => `${+x.slice(4, 6)}/${+x.slice(6)}`; return !f ? '' : f === t ? `${d(f)} 하루` : `${d(f)} ~ ${d(t)}`; };

function ruleTable(rows) {
  if (!rows.length) return '';
  rows = [...rows].sort((a, b) => b.dm_ok - a.dm_ok);
  const twoAny = rows.some((r) => r.mode === 'two');
  return `<div class="card" style="padding:4px 12px;overflow-x:auto"><table>
    <thead><tr><th>규칙 (전체 기간 누적)</th><th class="n">DM 받은 사람</th><th class="n">발송 횟수</th>${twoAny ? '<th class="n">받기 누름</th>' : ''}<th class="n">링크 누른 사람</th><th class="n">클릭률</th></tr></thead>
    <tbody>${rows.map((r) => `<tr><td>${esc(r.name)}${r.on ? '' : ' <span class="muted">(꺼짐)</span>'}</td>
      <td class="n">${fmt(r.u_dm_ok)}</td><td class="n">${fmt(r.dm_ok)}${r.dm_fail ? ` <span class="badc">(실패 ${fmt(r.dm_fail)})</span>` : ''}</td>
      ${twoAny ? `<td class="n">${r.mode === 'two' ? fmt(r.u_open) : '-'}</td>` : ''}
      <td class="n">${fmt(r.u_click)} <span class="muted">(${fmt(r.click)}회)</span></td><td class="n">${pct(r.u_click, r.u_dm_ok)}</td></tr>`).join('')}</tbody></table></div>`;
}

function acctTable(rows) {
  if (!rows.length) return '';
  rows = [...rows].sort((a, b) => b.u_dm_ok - a.u_dm_ok);
  return `<div class="card" style="padding:4px 12px;overflow-x:auto"><table>
    <thead><tr><th>계정 (선택한 기간)</th><th class="n">댓글 단 사람</th><th class="n">DM 받은 사람</th><th class="n">링크 누른 사람</th><th class="n">클릭률</th></tr></thead>
    <tbody>${rows.map((r) => `<tr><td>@${esc(r.username)}</td><td class="n">${fmt(r.u_match)}</td><td class="n">${fmt(r.u_dm_ok)}</td>
      <td class="n">${fmt(r.u_click)}</td><td class="n">${pct(r.u_click, r.u_dm_ok)}</td></tr>`).join('')}</tbody></table></div>`;
}

function drawChart(svg, rows) {
  const box = svg.parentElement;
  const draw = () => {
    const W = box.clientWidth, H = box.clientHeight, L = 34, B = 24, T = 8, R = 6;
    const max = Math.max(1, ...rows.map((d) => Math.max(d.dm_ok, d.click)));
    const raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))); const step = Math.max(1, [1, 2, 5, 10].find((m) => m * mag >= raw) * mag); const top = step * 4;
    const n = rows.length, cw = (W - L - R) / n, bw = Math.max(1.5, Math.min(14, cw * 0.36));
    const y = (v) => T + (H - T - B) * (1 - v / top);
    let g = '';
    for (let i = 0; i <= 4; i++) { const v = step * i, yy = y(v);
      g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end" font-size="11" fill="var(--sub)">${v}</text>`; }
    const every = Math.ceil(n / Math.max(2, Math.floor((W - L) / 46)));
    rows.forEach((d, i) => { const x = L + i * cw + cw / 2;
      if (d.dm_ok) g += `<rect x="${x - bw - 1}" y="${y(d.dm_ok)}" width="${bw}" height="${y(0) - y(d.dm_ok)}" rx="2" fill="var(--acc)"><title>${d.label} DM ${d.dm_ok}</title></rect>`;
      if (d.click) g += `<rect x="${x + 1}" y="${y(d.click)}" width="${bw}" height="${y(0) - y(d.click)}" rx="2" fill="var(--ok)"><title>${d.label} 클릭 ${d.click}</title></rect>`;
      if (i % every === 0 || i === n - 1) g += `<text x="${x}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--sub)">${d.label}</text>`; });
    svg.innerHTML = g;
  };
  const ro = new ResizeObserver(draw); ro.observe(box); draw();
}

function showSetup() {
  const s = S.setup || {};
  $('#dlgBody').classList.remove('split');
  const rows = [['리디렉션 URL (비즈니스 로그인 설정)', s.redirectUrl], ['웹훅 콜백 URL', s.webhookUrl], ['웹훅 확인 토큰', s.verifyToken], ['개인정보처리방침 URL', s.privacyUrl]];
  const d = $('#dlg');
  $('#dlgBody').innerHTML = `<h2 style="font-size:18px">메타 앱에 붙여넣을 값</h2>
    ${!s.hasApp ? '<div class="warn">Vercel 환경변수에 META_APP_SECRET(앱 시크릿 코드)이 아직 없어요. 넣고 재배포하면 확인 토큰이 바뀌니 그다음에 복사하세요.</div>' : ''}
    ${!s.hasDb ? '<div class="badc">DB(Upstash Redis)가 연결 안 돼 있어요.</div>' : ''}
    ${rows.map(([k, v], i) => `<label class="f">${esc(k)}<div class="row"><input value="${esc(v)}" readonly style="flex:1"><button data-cp="${i}">복사</button></div></label>`).join('')}
    <div class="row"><span class="sp"></span><button class="p" id="cN">닫기</button></div>`;
  d.showModal(); $('#cN').onclick = () => d.close();
  d.querySelectorAll('[data-cp]').forEach((b) => b.onclick = async () => { try { await navigator.clipboard.writeText(rows[b.dataset.cp][1]); toast('복사됨'); } catch { toast('직접 선택해서 복사하세요'); } });
}

function confirmBox(msg, fn) {
  const d = $('#dlg');
  $('#dlgBody').classList.remove('split');
  $('#dlgBody').innerHTML = `<h2 style="font-size:18px">${esc(msg)}</h2><div class="row"><span class="sp"></span><button class="g" id="cN">취소</button><button class="p" id="cY">확인</button></div>`;
  d.showModal(); $('#cN').onclick = () => d.close();
  $('#cY').onclick = async () => { try { await fn(); } catch (e) { toast(e.message); } d.close(); };
}
function showText(title, text) {
  const d = $('#dlg');
  $('#dlgBody').classList.remove('split');
  $('#dlgBody').innerHTML = `<h2 style="font-size:18px">${esc(title)}</h2><input value="${esc(text)}" readonly onclick="this.select()"><div class="row"><span class="sp"></span><button class="p" id="cN">닫기</button></div>`;
  d.showModal(); $('#cN').onclick = () => d.close();
}

key ? load() : renderLogin();
}
</script>
</body>
</html>
