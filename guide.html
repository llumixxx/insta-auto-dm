<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>인스타 자동 DM 연결 가이드</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0e0f12;color:#f2f2f4;font-family:-apple-system,system-ui,'Apple SD Gothic Neo',sans-serif}
.w{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;font-size:13px;color:#a0a3ab}
.bar{flex:1;height:6px;background:#26282e;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:#e1306c;transition:width .25s}
.sec{display:inline-block;margin:14px 0 10px;padding:5px 12px;border-radius:20px;font-size:13px;font-weight:700;background:#2a2c33}
.sec.a{background:#2563eb}.sec.c{background:#d97706}
.img{border-radius:16px;overflow:hidden;background:#000;border:1px solid #2a2c33;display:flex;justify-content:center}
.img img{display:block;width:100%;max-height:46dvh;object-fit:contain}
h1{font-size:24px;line-height:1.35;margin:16px 0 8px;display:flex;gap:10px;align-items:flex-start}
h1 .n{flex:none;min-width:34px;height:34px;border-radius:17px;background:#e1306c;font-size:17px;display:grid;place-items:center;margin-top:1px}
.b{color:#c4c7ce;font-size:16px;line-height:1.65;margin:0;padding-left:0;list-style:none}.b li{margin:3px 0}
details{margin-top:12px;background:#2a1d12;border:1px solid #5c3a17;border-radius:14px;padding:12px 14px}
summary{font-weight:700;color:#fdba74;font-size:15px;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
summary:after{content:' ▾'}details[open] summary:after{content:' ▴'}
details li{color:#fed7aa;font-size:14.5px;line-height:1.6;margin:6px 0}details ul{margin:6px 0 0;padding-left:18px}
.sp{flex:1;min-height:14px}
.nav{display:flex;gap:10px;position:sticky;bottom:0;padding-top:10px;background:linear-gradient(transparent,#0e0f12 30%)}
button{font:inherit;border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:800;color:#fff;cursor:pointer}
.prev{background:#2a2c33;flex:0 0 30%}.next{background:#e1306c;flex:1}
.skip{display:block;width:100%;margin-top:10px;background:transparent;border:1.5px solid #3a3c44;color:#c4c7ce;font-weight:700;font-size:15px;padding:13px}
.end{text-align:center;padding:30px 4px}.end .i{font-size:60px}.end h2{font-size:26px;margin:10px 0}
.safe{margin-top:22px;text-align:left;background:#14213d;border:1px solid #1e3a8a;border-radius:16px;padding:16px 18px}
.safe h3{margin:0 0 8px;font-size:16px;color:#93c5fd}.safe li{font-size:14px;line-height:1.65;color:#dbe4f5;margin:4px 0}.safe ul{margin:0;padding-left:18px}
</style></head><body><div class="w" id="app"></div>
<script>
const S=[{"img": "/guide/01.jpg", "sec": "1단계 · 테스터 수락하기", "title": "카톡 ① 링크 누르기", "body": ["받은 카톡 메시지에서 위쪽 링크(instagram.com…)를 눌러요.", "\"테스터 초대\"를 받으러 가는 링크예요."], "fix": ["인스타 앱이 열려버리면 → 링크를 꾹 눌러 \"복사\" → 사파리 주소창에 붙여넣기"]}, {"img": "/guide/02.jpg", "sec": "1단계 · 테스터 수락하기", "title": "인스타그램 로그인하기", "body": ["연결할 인스타 아이디와 비밀번호를 넣고 파란 \"로그인\"을 눌러요.", "이미 로그인돼 있으면 이 화면은 안 나와요 → 3번으로."], "fix": ["비밀번호가 기억 안 나면 → \"비밀번호를 잊으셨나요?\"로 먼저 재설정"], "skip": 2}, {"img": "/guide/03.jpg", "sec": "1단계 · 테스터 수락하기", "title": "\"테스터 초대\" 탭 누르기", "body": ["\"앱 및 웹사이트\" 화면이 나오면 위쪽 탭 중 맨 오른쪽 \"테스터 초대\"를 눌러요."], "fix": ["다른 계정으로 로그인돼 있으면 초대가 안 보여요 → 로그아웃 후 연결할 계정으로 다시 로그인"]}, {"img": "/guide/04.jpg", "sec": "1단계 · 테스터 수락하기", "title": "\"수락\" 누르기", "body": ["\"자동DM-IG\" 초대 아래 파란 \"수락\"을 눌러요.", "여기까지 하면 1단계 끝! 카톡으로 돌아가요."], "fix": ["\"자동DM-IG\"가 안 보이면 → 초대가 아직 안 온 거예요. 관리자에게 내 인스타 아이디를 알려주세요."]}, {"img": "/guide/05.jpg", "sec": "2단계 · 내 계정 연결하기", "title": "카톡 ② 링크 누르기", "body": ["이번엔 아래쪽 링크(insta-auto-dm…)를 눌러요.", "꼭 1단계(수락)를 먼저 하고 눌러야 해요."], "fix": ["\"잘못된 링크예요\"가 뜨면 → 관리자에게 메시지를 다시 받아주세요."]}, {"img": "/guide/06.jpg", "sec": "2단계 · 내 계정 연결하기", "title": "\"Instagram으로 계속하기\" 누르기", "body": ["Meta 화면이 나와요. 맨 아래 \"Instagram으로 계속하기\"를 눌러요.", "\"Facebook으로 계속하기\"가 아니에요!"], "fix": ["\"앱이 비활성 상태\" / \"사용할 수 없는 기능\"이 뜨면 → 1~4번 수락이 안 된 거예요. 1번부터 다시 해주세요."]}, {"img": "/guide/07.jpg", "sec": "개인 계정만 · 크리에이터로 바꾸기 (7~11번)", "title": "\"크리에이터\" 고르고 \"다음\"", "body": ["개인 계정이면 7~11번 화면이 나와요. (계정 종류를 \"크리에이터\"로 바꾸는 과정)", "\"크리에이터\"를 눌러 선택하고 아래 \"다음\"을 눌러요."], "fix": ["이 화면이 안 나오면 → 이미 크리에이터/비즈니스 계정이에요. 12번으로 건너뛰세요.", "실수로 \"비즈니스\"를 골라도 괜찮아요. 그대로 진행하면 돼요."], "skip": 11}, {"img": "/guide/08.jpg", "sec": "개인 계정만 · 크리에이터로 바꾸기 (7~11번)", "title": "\"다음\" 누르기", "body": ["크리에이터 계정 설명 화면이에요. 그냥 \"다음\"을 눌러요."], "fix": []}, {"img": "/guide/09.jpg", "sec": "개인 계정만 · 크리에이터로 바꾸기 (7~11번)", "title": "\"건강/뷰티\" 고르고 \"완료\"", "body": ["카테고리 목록에서 \"건강/뷰티\"를 눌러 선택하고 \"완료\"를 눌러요.", "\"프로필에 카테고리 표시\"는 체크 안 해도 돼요. (프로필에 안 보여요)"], "fix": ["목록에 안 보이면 → 위쪽 검색창에 \"건강\" 입력. 다른 카테고리를 골라도 연결엔 문제없어요."]}, {"img": "/guide/10.jpg", "sec": "개인 계정만 · 크리에이터로 바꾸기 (7~11번)", "title": "\"계속하기\" 누르기", "body": ["\"프로페셔널 프로필로 전환하시겠어요?\" 창에서 \"계속하기\"를 눌러요.", "비공개 계정이었다면 공개 계정으로 바뀌어요."], "fix": ["\"취소\"를 눌렀다면 → 카톡 ② 링크를 다시 누르면 처음부터 다시 나와요."]}, {"img": "/guide/11.jpg", "sec": "개인 계정만 · 크리에이터로 바꾸기 (7~11번)", "title": "\"완료\" 누르기", "body": ["\"크리에이터 프로필이 준비되었습니다\"가 나오면 성공! \"완료\"를 눌러요.", "팔로워, 게시물은 그대로예요. 나중에 개인 계정으로 되돌릴 수도 있어요."], "fix": []}, {"img": "/guide/12.jpg", "sec": "2단계 · 내 계정 연결하기", "title": "\"(내 아이디)님으로 로그인\" 누르기", "body": ["파란 버튼에 적힌 아이디가 연결할 계정인지 확인하고 눌러요."], "fix": ["다른 아이디가 적혀 있으면 → 아래 \"계정 전환\"을 눌러 연결할 계정으로 바꿔요."]}, {"img": "/guide/13.jpg", "sec": "2단계 · 내 계정 연결하기", "title": "내 계정 확인하고 \"Continue\"", "body": ["영어 화면이지만 괜찮아요!", "\"Instagram Accounts\" 칸에 내 아이디가 있는지 확인하고 맨 아래 파란 \"Continue\"를 눌러요.", "\"Ad Accounts\"(광고 계정)는 비어 있어도 돼요."], "fix": ["\"Instagram Accounts\" 칸이 비어 있으면 → 칸의 ▼를 눌러 내 계정 선택", "\"Business Portfolio\" 칸이 비어 있으면 → ▼ 눌러 새로 만들기, 이름은 내 이름으로"]}, {"img": "/guide/14.jpg", "sec": "2단계 · 내 계정 연결하기", "title": "\"Save\" 누르기", "body": ["자동DM이 쓸 권한 목록이에요. 맨 아래 파란 \"Save\"를 눌러요.", "광고 관련 문구가 보여도 광고비가 나가거나 광고가 올라가는 일은 없어요."], "fix": []}, {"img": "/guide/15.jpg", "sec": "2단계 · 내 계정 연결하기", "title": "\"연결 완료!\"가 나오면 끝!", "body": ["이 화면이 보이면 모든 설정이 끝났어요. 창은 닫아도 돼요."], "fix": ["\"링크가 만료됐어요\"가 뜨면 → 10분이 지난 거예요. 카톡 ② 링크를 다시 눌러주세요.", "\"연결이 안 됐어요\"가 뜨면 → 1~4번 수락을 먼저 하고 ② 링크를 다시 눌러주세요.", "연결은 됐는데 DM이 안 나가면 → 인스타 설정 → 메시지 및 스토리 답장 → 메시지 컨트롤 → \"연결된 도구\" 허용 켜기", "그래도 안 되면 → 화면을 캡처해서 관리자에게 보내주세요."]}];
const A='1단계 · 테스터 수락하기';
let i=0;try{const h=+location.hash.slice(1);if(h>=1&&h<=S.length+1)i=h-1}catch(e){}
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
S.forEach(s=>{const im=new Image();im.src=s.img});
function go(n){i=Math.max(0,Math.min(S.length,n));history.replaceState(null,'','#'+(i+1));render();scrollTo(0,0)}
function render(){
  const pct=Math.round(Math.min(i,S.length)/S.length*100);
  if(i>=S.length){app.innerHTML=`<div class="top"><div class="bar"><i style="width:100%"></i></div><span>완료</span></div>
  <div class="end"><div class="i">🎉</div><h2>연결 끝!</h2><p style="color:#a0a3ab;line-height:1.7">이제 지정한 게시물에 키워드 댓글이 달리면<br>자동으로 DM이 나가요.</p>
  <div class="safe"><h3>개인정보 및 보안 안내</h3><ul>
  <li>비밀번호는 인스타그램(Meta) 공식 화면에서만 입력되며, 저희에게 전달되지 않습니다.</li>
  <li>받으신 DM 내용은 저희가 읽을 수 없으며, DM을 읽는 기능 자체를 만들지 않았습니다.</li>
  <li>저희 시스템은 지정한 게시물에 키워드 댓글이 달렸을 때 자동으로 DM을 보내는 일만 합니다.</li>
  <li>광고를 만들거나 비용이 결제되는 일은 없습니다.</li>
  <li>원하실 때는 언제든 인스타그램 설정 → 앱 및 웹사이트에서 연결을 해제하실 수 있습니다.</li></ul></div></div>
  <div class="sp"></div><div class="nav"><button class="prev" onclick="go(i-1)">이전</button><button class="next" onclick="go(0)">처음으로</button></div>`;return}
  const s=S[i],cls=s.sec===A?'a':(s.sec.includes('개인')?'c':'');
  app.innerHTML=`<div class="top"><div class="bar"><i style="width:${pct}%"></i></div><span>${i+1} / ${S.length}</span></div>
  <div><span class="sec ${cls}">${esc(s.sec)}</span></div>
  <div class="img"><img src="${s.img}" alt=""></div>
  <h1><span class="n">${i+1}</span><span>${esc(s.title)}</span></h1>
  <ul class="b">${s.body.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul>
  ${s.fix.length?`<details><summary>안 되면?</summary><ul>${s.fix.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></details>`:''}
  ${s.skip!=null?`<button class="skip" onclick="go(${s.skip})">이 화면이 안 나왔어요 → ${s.skip+1}번으로</button>`:''}
  <div class="sp"></div>
  <div class="nav">${i?'<button class="prev" onclick="go(i-1)">이전</button>':''}<button class="next" onclick="go(i+1)">${i==S.length-1?'완료':'다음'}</button></div>`;
}
render();
let x0=null;app.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
app.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>70&&!e.target.closest('details'))go(i+(dx<0?1:-1));x0=null});
</script></body></html>
