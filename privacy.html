<style>body{max-width:720px;margin:40px auto;padding:0 20px;font:16px/1.7 system-ui,sans-serif;color:#222}h1{font-size:24px}</style></head>
<body><h1>개인정보처리방침</h1>
<p>이 서비스는 연결된 인스타그램 프로페셔널 계정의 게시물 댓글에 자동으로 DM과 대댓글을 보내기 위해 사용됩니다.</p>
<p><b>수집하는 정보</b>: 연결한 계정의 사용자명, 프로필 사진, 액세스 토큰. 댓글 작성자의 사용자명과 댓글 내용(발송 기록용, 최근 200건만 보관).</p>
<p><b>이용 목적</b>: 키워드가 포함된 댓글에 자동 응답하기 위해서만 사용하며, 제3자에게 제공하지 않습니다.</p>
<p><b>삭제</b>: 관리자에게 요청하거나 인스타그램 설정 &gt; 앱 및 웹사이트에서 연결을 해제하면 관련 정보가 삭제됩니다.</p>
